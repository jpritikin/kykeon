<section id="admin" data-client-id="{{ site.Params.googleClientId }}">
  <div class="g_id_signin-slot"></div>
  <p class="flash diagnostic" hidden></p>
  <div class="admin-testimonials" hidden>
    <h2>Add a testimonial</h2>
    <form class="add-testimonial">
      <label>Name or pseudonym (optional)<input type="text" name="name" maxlength="80"></label>
      <label>Hawaiian baby woodrose seeds (optional)<input type="number" name="seeds" min="0" step="1"></label>
      <label>Tetrahydroharmine co-administered, in mg (optional)<input type="number" name="thh_mg" min="0" step="any"></label>
      <label>Words<textarea name="body" rows="8" maxlength="4000" required></textarea></label>
      <button>Add</button>
    </form>
    <h2>Pending testimonials</h2>
    <div class="pending"></div>
    <h2>Approved testimonials</h2>
    <div class="approved"></div>
  </div>
</section>
<script src="https://accounts.google.com/gsi/client" async defer></script>
{{ with resources.Get "admin.ts" | js.Build (dict "minify" true) }}<script src="{{ .RelPermalink }}" defer></script>{{ end }}
