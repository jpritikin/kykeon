<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <a class="brand" href="/">⚱ Second Church of the Kykeon</a>
    <nav>{{ range .Site.Menus.main }}<a href="{{ .URL }}">{{ .Name }}</a>{{ end }}</nav>
  </header>
  <div class="meander"></div>
  <main>{{ block "main" . }}{{ end }}</main>
  {{ with resources.Get "status.ts" | js.Build (dict "minify" true) }}<script src="{{ .RelPermalink }}"></script>{{ end }}
  <footer>
    <p>© 2026 Joshua N. Pritikin. All rights reserved.</p>
  </footer>
</body>
</html>
